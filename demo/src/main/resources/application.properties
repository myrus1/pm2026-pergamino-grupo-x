spring.application.name=demo

# 1. Server Configuration
server.port=8080

# 2. Database Configuration (los valores salen del .env de la raiz)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Configuracion para que la BD se actualice sola.
spring.jpa.hibernate.ddl-auto=update
#La sesion JPA se cierra al salir del servicio: lo que use relaciones LAZY va en un metodo @Transactional
spring.jpa.open-in-view=false
