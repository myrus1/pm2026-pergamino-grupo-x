spring.application.name=demo

# 1. Server Configuration
server.port=8080

# 2. Database Configuration (los valores salen del .env de la raiz)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Configuracion para que la BD se actualice sola.
spring.jpa.hibernate.ddl-auto=update
#La sesion JPA se cierra al salir del servicio: lo que use relaciones LAZY va en un metodo @Transactional
spring.jpa.open-in-view=false

# 3. JWT (la clave sale del .env; el valor por defecto es solo para desarrollo)
jwt.secret=${JWT_SECRET:pm2026-pergamino-clave-de-desarrollo-para-firmar-tokens-jwt-con-hmac512}

# 4. CORS: origenes del frontend autorizados (lista separada por comas; "*" en desarrollo)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# 5. Documentacion OpenAPI (springdoc): Swagger UI en /swagger-ui.html y spec en /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
