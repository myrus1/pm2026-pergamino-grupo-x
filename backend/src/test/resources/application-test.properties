# Propiedades de tests (se activan con @ActiveProfiles("test") en los tests que
# levantan el contexto completo).
#
# La BD compartida del curso (Aiven) tiene 20 conexiones en total y un @SpringBootTest
# usa Hikari por defecto (10). Con dos contextos en la misma JVM se pasaba del limite
# y fallaba "Unable to determine Dialect without JDBC metadata". Los tests son
# secuenciales, asi que con dos conexiones por contexto alcanza.
spring.datasource.hikari.maximum-pool-size=2
