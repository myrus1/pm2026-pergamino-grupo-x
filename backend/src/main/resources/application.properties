spring.application.name=pm2026-backend

# 1. Server Configuration
server.port=8080

# 2. Database Configuration (los valores salen del .env de la raiz)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Configuracion para que la BD se actualice sola.
spring.jpa.hibernate.ddl-auto=update
#La sesion JPA se cierra al salir del servicio: lo que use relaciones LAZY va en un metodo @Transactional
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# 3. JWT (la clave sale del .env; el valor por defecto es solo para desarrollo)
jwt.secret=${JWT_SECRET:pm2026-pergamino-clave-de-desarrollo-para-firmar-tokens-jwt-con-hmac512}
# Duracion del token en segundos (10 dias). Se devuelve como expiresIn en POST /api/auth/token.
jwt.expiration=${JWT_EXPIRATION:864000}

# 4. CORS: origenes del frontend autorizados (lista separada por comas; "*" en desarrollo)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# 5. Documentacion OpenAPI (springdoc): Swagger UI en /swagger-ui.html y spec en /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# 6. Observabilidad (#28): Actuator + Micrometer/Prometheus. Ver "Observabilidad" en el README.
# health es publico; info, metrics y prometheus piden token de administrador (ActuatorAccessFilter).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# health muestra el estado de cada componente (db, disco) pero no los detalles (version de la BD, rutas).
# El chequeo de la BD usa una conexion del pool de Hikari: no abre conexiones nuevas.
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=${spring.application.name}
info.app.description=API de gestion de cursos - PM2026 Pergamino
info.app.version=@project.version@
management.metrics.tags.application=${spring.application.name}
# Cada linea de log lleva el correlationId de la request ([-] fuera de una request).
# Para logs en JSON: variable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (incluye el correlationId).
logging.pattern.correlation=[%X{correlationId:--}] 

# 7. i18n: mensajes al usuario en messages.properties (es, default) y messages_en.properties (en)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# Una clave sin traducir devuelve la clave en vez de lanzar NoSuchMessageException.
spring.messages.use-code-as-default-message=true
# Espanol por defecto; el header Accept-Language elige el idioma (en / en-US -> messages_en).
spring.web.locale=es
spring.web.locale-resolver=accept-header
