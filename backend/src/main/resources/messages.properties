# Mensajes al usuario de la API (espanol, idioma por defecto).
# Cada clave es un ErrorCode (shared/exception/ErrorCode) o una clave interna de
# ApiExceptionHandler. Los argumentos se interpolan con MessageFormat: {0}, {1}, ...
# Ojo: en un mensaje con {n}, cada apostrofo simple se escribe duplicado ('').
# El test MessageBundlesTest verifica que estas claves existan tambien en messages_en.properties.

